name: Build & Release XCFrameworks

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  build:
    name: Build & Release
    runs-on: macos-14
    permissions:
      contents: write

    env:
      RELEASE_NOTES_PATH: output/release/RELEASE_NOTES.md

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.2"

      - name: Derive Release Metadata
        id: release_meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="manual-${GITHUB_RUN_ID}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=${tag}" >> "$GITHUB_ENV"

      - name: Build & Package XCFrameworks
        run: |
          chmod +x build_xcframeworks.sh
          bundle exec rake release:prepare

      - name: List Artifacts
        run: ls -R output/release

      # Written to a file and passed via body_path rather than through GITHUB_OUTPUT,
      # so the Markdown table is never reinterpreted as a heredoc terminator or an
      # expression substitution.
      - name: Generate Release Notes
        shell: bash
        run: |
          : "${RELEASE_TAG:?RELEASE_TAG was not set by the Derive Release Metadata step}"

          shopt -s nullglob
          artifacts=(output/release/artifacts/*.xcframework.zip)
          if [[ ${#artifacts[@]} -eq 0 ]]; then
            echo "::error::No XCFramework artifacts found in output/release/artifacts"
            exit 1
          fi

          {
            printf 'Tag: `%s`\n\n' "${RELEASE_TAG}"
            printf '## XCFrameworks\n\n'
            printf 'Checksums are the SHA-256 of each zip, identical to what `swift package compute-checksum` reports. Use them for SwiftPM `binaryTarget(name:url:checksum:)`.\n\n'
            printf '| Artifact | Checksum (SHA-256) |\n'
            printf '| --- | --- |\n'
            for zip in "${artifacts[@]}"; do
              name="$(basename "${zip}")"
              checksum="$(shasum -a 256 "${zip}" | cut -d ' ' -f 1)"
              printf '| `%s` | `%s` |\n' "${name}" "${checksum}"
            done
          } > "${RELEASE_NOTES_PATH}"

          echo "Generated release notes:"
          cat "${RELEASE_NOTES_PATH}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: Lynx Release ${{ steps.release_meta.outputs.tag }}
          body_path: ${{ env.RELEASE_NOTES_PATH }}
          files: output/release/artifacts/*.xcframework.zip
          # Without this a glob matching nothing only warns, publishing an
          # asset-less release at a tag consumers may already pin.
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

      - name: Upload Build Artifacts (Workflow)
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.release_meta.outputs.tag }}
          path: output/release/artifacts/
          retention-days: 30
